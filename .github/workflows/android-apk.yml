name: Build TITAN Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'buildozer>=1.5.0' 'cython<3.4'
      - name: Build debug APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: '0'
        run: buildozer -v android debug
      - name: Verify APK exists
        run: |
          ls -lah bin/
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-AI-V45-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
